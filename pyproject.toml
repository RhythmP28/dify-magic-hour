[project]
name = "dify-magic-hour"
version = "0.0.1"
description = "Magic Hour AI video and image generation tool plugin for Dify"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "dify-plugin>=0.9.0,<0.10.0",
    "magic_hour>=0.75.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
